# --- Salida a InfluxDB v2 ---
# Completar token/org/bucket una vez que Influx este arriba.
[[outputs.influxdb_v2]]
  urls = ["http://influxdb:8086"]
  token = "$INFLUX_TOKEN"
  organization = "$INFLUX_ORG"
  bucket = "$INFLUX_BUCKET"

# Descomentar para debug rapido sin Influx (imprime en stdout):
