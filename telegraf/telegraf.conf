# Config de PRODUCCION: le pega directo a las 3 unidades Liebert/Emerson por HTTP
# y manda los datos a InfluxDB. Mismo parseo XML que telegraf-test.conf, ya
# validado contra los snapshots reales en datasets/aa1.txt, aa2.txt, aa3.txt.

[agent]
  interval = "60s"
  flush_interval = "10s"
  skip_processors_after_aggregators = false
  omit_hostname = true

# --- Unidad 1 ---
[[inputs.http]]
  urls = ["http://$LIEBERT_AA1_IP"]
  timeout = "10s"
  data_format = "xml"
  name_override = "liebert_ac"

  [inputs.http.tags]
    equipo = "aa1"
    ip     = "$LIEBERT_AA1_IP"

  [[inputs.http.xpath]]
    metric_selection = "//Item"

    [inputs.http.xpath.tags]
      item_id   = "@id"
      item_name = "@name"
      label     = "Label"
      unit      = "Unit"

    [inputs.http.xpath.fields]
      value_num = "number(Value)"
      value_str = "string(Value)"

