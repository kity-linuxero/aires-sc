# Config de PRUEBA: lee los snapshots ya guardados (datasets/aa1.txt, aa2.txt, aa3.txt)
# en vez de pegarle a las IPs. Sirve para validar el parseo XML sin red y sin Influx.
#
# Probar con:
#   docker run --rm -v "${PWD}\telegraf:/etc/telegraf:ro" -v "${PWD}\datasets:/datasets:ro" telegraf:1.39.3 --config /etc/telegraf/telegraf-test.conf --test

[agent]
  interval = "60s"
  flush_interval = "10s"
  skip_processors_after_aggregators = false

# --- Unidad 1 (aa1.txt / 192.168.6.1) ---
[[inputs.file]]
  files = ["/datasets/aa1.txt"]
  data_format = "xml"
  name_override = "liebert_ac"

  [inputs.file.tags]
    equipo = "aa1"
    host   = "192.168.6.1"

  [[inputs.file.xpath]]
    metric_selection = "//Item"

    [inputs.file.xpath.tags]
      item_id   = "@id"
      item_name = "@name"
      label     = "Label"
      unit      = "Unit"

    [inputs.file.xpath.fields]
      # number() castea a float; si el valor no es numerico (ej "---", "No",
      # "Alarm On") devuelve NaN y Telegraf descarta ese field en ese punto
      # en vez de fallar el metric completo o generar conflicto de tipos en Influx.
      value_num = "number(Value)"
      # copia siempre el texto crudo tambien, útil para status tipo "Alarm On" / "No"
      value_str = "string(Value)"

